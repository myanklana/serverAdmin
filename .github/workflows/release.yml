name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build agent
        run: ./scripts/package-agent.sh
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/server-manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/server-manager:latest
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/server-manager-agent.jar
            dist/server-manager-agent.jar.sha256
            scripts/install-agent-linux.sh
            scripts/start-agent.sh
            scripts/start-agent.ps1
