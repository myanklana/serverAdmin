app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:server-manager-api}
    audience: ${APP_JWT_AUDIENCE:server-manager-web}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
