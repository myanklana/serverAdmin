spring:
  datasource:
    url: jdbc:h2:mem:servermanager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: test-secret-with-at-least-thirty-two-characters
    issuer: server-manager-api
    audience: server-manager-web
    expiration-minutes: 120
