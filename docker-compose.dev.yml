# Database only, for running the API and the panel from source (see CONTRIBUTING.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servermanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
