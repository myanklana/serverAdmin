# Production-like local installation. Run ./scripts/setup.sh once to create .env.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servermanager
      POSTGRES_USER: servermanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup.sh to create the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servermanager -d servermanager"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/myanklana/server-manager:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/servermanager
      SPRING_DATASOURCE_USERNAME: servermanager
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_REGISTRATION_OPEN: ${APP_REGISTRATION_OPEN:-false}
      APP_METRICS_RETENTION_DAYS: ${APP_METRICS_RETENTION_DAYS:-30}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/data

volumes:
  postgres-data:
  app-data:
